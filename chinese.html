    function searchDish() {
      let input = document.getElementById("searchInput").value.toLowerCase();
      let dishes = document.getElementsByClassName("dish");

      for (let i = 0; i < dishes.length; i++) {
        let dishName = dishes[i].querySelector("h3").innerText.toLowerCase();

        if (dishName.includes(input)) {
          dishes[i].style.display = "";
        } else {
          dishes[i].style.display = "none";
        }
      }
    }
</script>
