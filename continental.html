<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Continental Recipes | AC Flavors</title>

  <!-- CSS -->
  <link rel="stylesheet" href="cuisine.css" />

  <!-- JAVASCRIPT -->
  <script>
    function goBack() {
      window.history.back();
    }

    function searchDish() {
      let input = document.getElementById("searchInput").value.toLowerCase();
      let dishes = document.getElementsByClassName("dish");

      for (let i = 0; i < dishes.length; i++) {
        let dishName = dishes[i].querySelector("h3").innerText.toLowerCase();
        dishes[i].style.display = dishName.includes(input) ? "" : "none";
      }
    }
  </script>
</head>

<body>

  <!-- BACK ARROW -->
  <div class="back-arrow" onclick="goBack()">←</div>

  <!-- HEADER -->
  <header>
    <h1>Continental Cuisine</h1>
  </header>

  <!-- SEARCH BAR -->
  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="Search dishes..."
      onkeyup="searchDish()"
    />
  </div>

  <!-- DISHES -->
  <section class="dish-container">

    <div class="dish">
      <img src="https://upload.wikimedia.org/wikipedia/commons/8/89/Grilled_chicken_breast.jpg" alt="Grilled Chicken">

      <div class="buttons">
        <a href="#">Recipe</a>

      </div>
    </div>

    <div class="dish">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6d/Steak_dinner.jpg" alt="Beef Steak">

      <div class="buttons">

    <div class="dish">
      <img src="https://upload.wikimedia.org/wikipedia/commons/d/d8/Fish_and_chips_black_background.jpg" alt="Fish and Chips">
      <h3>Fish & Chips</h3>
      <div class="buttons">

    <div class="dish">
      <img src="https://upload.wikimedia.org/wikipedia/commons/f/f5/Baked_potato_with_toppings.jpg" alt="Baked Potato">
      <h3>Baked Potato</h3>

</html>
